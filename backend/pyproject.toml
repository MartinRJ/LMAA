[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lmaa-backend"
version = "0.1.0"
description = "Backend für den Local Media Analysis Assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "openai==3.6.0",
    "pydantic==2.13.4",
    "uvicorn==0.52.4",
    "youtube-transcript-api==1.2.4",
]

[project.scripts]
lmaa-backend = "lmaa_backend.server:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
